<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5368d9">
  <title>音乐教育感知维度测评系统</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="app" class="app-shell">
  <section id="loginView" class="login-view">
    <div class="login-brand">
      <div class="login-logo">♫</div>
      <h1>音乐教育感知维度测评系统</h1>
    </div>
    <form id="loginForm" class="login-card">
      <label class="field">
        <span>账号</span>
        <input id="username" type="text" autocomplete="username" placeholder="请输入账号">
      </label>
      <label class="field">
        <span>密码</span>
        <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码">
      </label>
      <p id="loginError" class="form-error"></p>
      <button type="submit" class="primary-button full-button">登录</button>
    </form>
  </section>

  <section id="systemView" class="system-view hidden">
    <header class="topbar">
      <button id="backBtn" class="icon-button hidden" aria-label="返回">‹</button>
      <div class="topbar-title">
        <strong>音乐教育感知维度测评系统</strong>
        <small id="pageSubtitle">首页</small>
      </div>
      <button id="headerAction" class="icon-button" aria-label="消息">●</button>
    </header>

    <main id="mainView" class="main-view"></main>

    <nav id="bottomNav" class="bottom-nav">
      <button data-route="home" class="nav-item active"><span>⌂</span><b>首页</b></button>
      <button data-route="assessment" class="nav-item"><span>♫</span><b>测评</b></button>
      <button data-route="culture" class="nav-item"><span>楚</span><b>湖湘文化</b></button>
      <button data-route="courses" class="nav-item"><span>课</span><b>课程</b></button>
      <button data-route="profile" class="nav-item"><span>人</span><b>我的</b></button>
    </nav>
  </section>
</div>

<div id="modalBackdrop" class="modal-backdrop hidden">
  <section id="modalCard" class="modal-card"></section>
</div>

<div id="toast" class="toast"></div>
<script src="assets/app.js"></script>
</body>
</html>
